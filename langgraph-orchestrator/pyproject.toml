[project]
name = "aci-langgraph-orchestrator"
version = "0.1.0"
description = "LangGraph Orchestrator for ACI agentic workflows"
requires-python = ">=3.10"
dependencies = [
	"langgraph>=0.2.50",
	"langchain>=0.3.10",
	"langchain-core>=0.3.0",
	"langchain-openai>=0.2.10",
	"langchain-mcp-adapters>=0.1.0",
	"python-dotenv>=1.0",
]

[project.optional-dependencies]
# Phoenix eval harness (evals/). arize-phoenix brings the datasets/experiments
# client; the otel packages are the ones chainlit_app.py already uses.
evals = [
	"arize-phoenix>=5.0",
	"arize-phoenix-otel>=0.6",
	"openinference-instrumentation-langchain>=0.1.29",
]
